<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b2e12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Fendaria</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Selección de personaje -->
  <div id="menu" class="overlay">
    <div class="panel wide">
      <h1 class="title">Fen<span>daria</span></h1>
      <p class="subtitle">Cierra las Grietas. Reclama el ámbar.</p>
      <div id="classList" class="cards"></div>
      <button id="btnStart" class="btn big" disabled>Elige un personaje</button>
      <p id="menuHint" class="small"></p>
    </div>
  </div>

  <!-- Villa Candela (hub) -->
  <div id="hub" class="overlay side">
    <div class="panel hubpanel">
      <h2 class="gold">Villa Candela</h2>
      <div id="hubChar"></div>
      <div class="faille">
        <button id="fMinus" class="btn round">−</button>
        <div id="fLabel"></div>
        <button id="fPlus" class="btn round">+</button>
      </div>
      <button id="btnZaap" class="btn big">🌀 Cruzar el Portal Rúnico</button>
      <div class="row2">
        <button id="btnInv" class="btn">🎒 Personaje</button>
        <button id="btnBakery" class="btn">🧪 Poción · 40 ámbar</button>
      </div>
      <button id="btnChange" class="btn ghost">Cambiar de personaje</button>
    </div>
  </div>

  <!-- Ficha de personaje (equipo, características y bolsa) -->
  <div id="inv" class="overlay sheet-ov">
    <div class="sheet">
      <header class="sh-head">
        <span id="shName" class="sh-name"></span>
        <span id="shLevel" class="sh-lvl"></span>
        <div class="sh-xp"><div id="shXp"></div></div>
        <span id="shPower" class="sh-power"></span>
        <span id="shAmber" class="sh-amber"></span>
        <button id="btnInvClose" class="sh-close" aria-label="Cerrar">✕</button>
      </header>
      <div class="sh-body">
        <section id="shDoll" class="sh-doll"></section>
        <section class="sh-stats">
          <div class="sh-sub"><h2>Características</h2><span id="shPoints"></span></div>
          <div id="shStatRows"></div>
          <div id="shDerived" class="sh-derived"></div>
        </section>
        <section class="sh-bag">
          <div class="sh-tabs" id="shTabs"></div>
          <div id="bagGrid" class="sh-grid"></div>
          <button id="btnSellCommons" class="sh-sell">Vender comunes</button>
        </section>
      </div>
    </div>
    <div id="itemCard" class="icard-ov"></div>
    <div id="shToast" class="sh-toast"></div>
  </div>

  <!-- Pausa -->
  <div id="pause" class="overlay">
    <div class="panel">
      <h2>Pausa</h2>
      <div id="pauseStats" class="stats"></div>
      <button id="btnResume" class="btn big">Continuar</button>
      <button id="btnPauseInv" class="btn">🎒 Personaje</button>
      <button id="btnMute" class="btn">Sonido: ON</button>
      <button id="btnQuit" class="btn ghost">Abandonar la Grieta (conservas el botín)</button>
    </div>
  </div>

  <!-- Grieta cerrada -->
  <div id="end" class="overlay">
    <div class="panel">
      <h2 id="endTitle" class="gold">Grieta cerrada</h2>
      <div id="endStats" class="stats"></div>
      <button id="btnEndHub" class="btn big">Volver a Villa Candela</button>
    </div>
  </div>

  <!-- Muerte -->
  <div id="dead" class="overlay">
    <div class="panel">
      <h2 class="red">Has caído...</h2>
      <p class="small">Despiertas junto al Portal de Villa Candela. Conservas el botín y la experiencia.</p>
      <div id="deadStats" class="stats"></div>
      <button id="btnDeadHub" class="btn big">Volver a Villa Candela</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/art.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
